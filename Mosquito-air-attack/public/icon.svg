<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Dark Military Slate Background -->
  <rect width="512" height="512" rx="100" fill="url(#skyGrad)"/>

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Red Crosshair Target Center -->
  <circle cx="256" cy="256" r="28" fill="none" stroke="#ef4444" stroke-width="6"/>
  <circle cx="256" cy="256" r="8" fill="#ef4444"/>

  <!-- Ground Mountain Hills Silhouette -->
  <path d="M 30 450 Q 140 370 256 420 Q 380 470 482 430 L 482 490 L 30 490 Z" fill="#15803d"/>
  <path d="M 0 460 Q 120 400 240 440 Q 360 480 512 430 L 512 512 L 0 512 Z" fill="#166534"/>

  <!-- Upward Interceptor Missile -->
  <g transform="translate(256, 210) rotate(-45)">
    <!-- Propulsion Flame -->
    <polygon points="0,75 -14,115 0,95 14,115" fill="#f97316"/>
    <polygon points="0,75 -7,100 0,90 7,100" fill="#fef08a"/>
    <!-- Fins -->
    <polygon points="-22,65 -8,45 -8,70" fill="#0f172a"/>
    <polygon points="22,65 8,45 8,70" fill="#0f172a"/>
    <!-- Missile Fuselage -->
    <rect x="-9" y="-45" width="18" height="115" rx="3" fill="url(#rocketGrad)"/>
    <!-- Red Nose Warhead -->
    <polygon points="0,-75 -9,-45 9,-45" fill="#ef4444"/>
  </g>

  <!-- Golden Stars -->
  <polygon points="120,120 125,135 140,135 128,144 132,158 120,149 108,158 112,144 100,135 115,135" fill="#facc15"/>
  <polygon points="390,120 395,135 410,135 398,144 402,158 390,149 378,158 382,144 370,135 385,135" fill="#facc15"/>

  <!-- Retro Frame Border -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.8"/>
</svg>
